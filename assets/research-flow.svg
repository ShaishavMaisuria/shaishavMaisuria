<svg width="1200" height="180" viewBox="0 0 1200 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated research workflow strip</title>
  <desc id="desc">A five-step animated workflow moving from discover to present.</desc>
  <defs>
    <linearGradient id="rail" x1="120" y1="90" x2="1080" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F2742"/>
      <stop offset="1" stop-color="#091522"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-70%" width="180%" height="240%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.2 0 0 0 0 0.8 0 0 0 0 1 0 0 0 0.7 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="180" rx="24" fill="#07111F"/>
  <path d="M138 90H1062" stroke="url(#rail)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M138 90H1062" stroke="url(#rail)" stroke-width="4" stroke-linecap="round" stroke-dasharray="70 130" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-400" dur="5s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(138 90)">
    <circle r="8" fill="#FFFFFF" filter="url(#glow)">
      <animateMotion dur="4.8s" repeatCount="indefinite" path="M0 0H924"/>
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(58 42)">
      <rect width="160" height="96" rx="18" fill="url(#card)" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="80" y="43" text-anchor="middle" fill="#E0F2FE" font-size="18" font-weight="700">Discover</text>
      <text x="80" y="68" text-anchor="middle" fill="#93C5FD" font-size="13">sources + ideas</text>
    </g>
    <g transform="translate(278 42)">
      <rect width="160" height="96" rx="18" fill="url(#card)" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="80" y="43" text-anchor="middle" fill="#E0F2FE" font-size="18" font-weight="700">Build</text>
      <text x="80" y="68" text-anchor="middle" fill="#93C5FD" font-size="13">tools + drafts</text>
    </g>
    <g transform="translate(518 42)">
      <rect width="160" height="96" rx="18" fill="url(#card)" stroke="#34D399" stroke-opacity="0.5"/>
      <text x="80" y="43" text-anchor="middle" fill="#E0F2FE" font-size="18" font-weight="700">Verify</text>
      <text x="80" y="68" text-anchor="middle" fill="#A7F3D0" font-size="13">claims + code</text>
    </g>
    <g transform="translate(758 42)">
      <rect width="160" height="96" rx="18" fill="url(#card)" stroke="#A3E635" stroke-opacity="0.46"/>
      <text x="80" y="43" text-anchor="middle" fill="#F0FDF4" font-size="18" font-weight="700">Ship</text>
      <text x="80" y="68" text-anchor="middle" fill="#D9F99D" font-size="13">docs + releases</text>
    </g>
    <g transform="translate(982 42)">
      <rect width="160" height="96" rx="18" fill="url(#card)" stroke="#F59E0B" stroke-opacity="0.55"/>
      <text x="80" y="43" text-anchor="middle" fill="#FFFBEB" font-size="18" font-weight="700">Present</text>
      <text x="80" y="68" text-anchor="middle" fill="#FDE68A" font-size="13">explain + improve</text>
    </g>
  </g>
</svg>
