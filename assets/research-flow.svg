    <rect x="1" y="1" width="1198" height="188" rx="25" stroke="#E2E8F0"/>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="56" y="44" fill="#0F172A" font-size="18" font-weight="850">Brand focus</text>
      <text x="56" y="68" fill="#64748B" font-size="13" font-weight="600">A concise operating style for technical work.</text>
