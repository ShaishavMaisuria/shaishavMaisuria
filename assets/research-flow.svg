<svg width="1200" height="190" viewBox="0 0 1200 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shaishav Maisuria brand pillars</title>
  <desc id="desc">Four contained brand pillar cards for systems, data, craft, and clarity.</desc>
