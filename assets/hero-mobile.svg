  <clipPath id="map-clip"><rect width="565" height="346"/></clipPath>
</defs>
<style>
  .map-label { paint-order: stroke; stroke: #f9fcfa; stroke-width: 5; stroke-linejoin: round; }
  @media (prefers-reduced-motion: no-preference) {
    .trace { stroke-dasharray: 100 100; animation: connect 8s ease-in-out infinite; }
    .confirmation { animation: confirm 8s ease-in-out infinite; }
    @keyframes connect {
      0%, 8% { stroke-dashoffset: 100; opacity: 0; }
      11% { opacity: 1; }
      32%, 83% { stroke-dashoffset: 0; opacity: 1; }
      94%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes confirm {
      0%, 27%, 100% { opacity: 0; }
      37%, 83% { opacity: 1; }
    }
  }
</style>
