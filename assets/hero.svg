<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shaishav Maisuria geospatial AI and data infrastructure header</title>
  <desc id="desc">A clean white professional brand header for geospatial AI, big-data ETL, AWS pipelines, and AI engineering.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="brand" x1="72" y1="316" x2="1106" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E"/>
      <stop offset="0.54" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <pattern id="mapGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" stroke="#D8E8E4" stroke-width="1"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="380" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#canvas)"/>
    <rect x="1" y="1" width="1198" height="378" rx="27" stroke="#E2E8F0"/>

    <rect x="56" y="42" width="1088" height="296" rx="28" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="56" y="42" width="8" height="296" rx="4" fill="url(#brand)"/>

    <g transform="translate(104 82)" font-family="Inter, Segoe UI, Arial, sans-serif">
      <rect width="138" height="174" rx="30" fill="#F8FAFC" stroke="#D8E8E4"/>
      <rect x="18" y="18" width="102" height="102" rx="24" fill="#FFFFFF" stroke="#D8E8E4"/>
      <rect x="20" y="20" width="98" height="98" rx="22" fill="url(#mapGrid)" opacity="0.82"/>
      <path d="M34 84C51 66 63 77 77 56C88 38 101 44 109 31" stroke="#0F766E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8">
        <animate attributeName="stroke-dashoffset" values="0;-64" dur="7s" repeatCount="indefinite"/>
      </path>
      <circle cx="34" cy="84" r="5" fill="#0F766E">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="77" cy="56" r="5" fill="#0E7490">
        <animate attributeName="opacity" values="1;0.45;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="109" cy="31" r="5" fill="#2563EB">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <text x="69" y="78" text-anchor="middle" fill="#0F172A" font-size="32" font-weight="850">SM</text>
      <text x="69" y="148" text-anchor="middle" fill="#0F766E" font-size="13" font-weight="850" letter-spacing="1">GEO AI</text>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="280" y="108" fill="#0F172A" font-size="40" font-weight="850">Shaishav Maisuria</text>
      <text x="282" y="148" fill="#0F766E" font-size="27" font-weight="850">Geospatial AI &amp; Data Infrastructure</text>
      <text x="282" y="182" fill="#334155" font-size="18" font-weight="650">Spatial systems, big-data ETL, AWS pipelines,</text>
      <text x="282" y="209" fill="#334155" font-size="18" font-weight="650">and AI engineering for reliable technical workflows.</text>
      <text x="282" y="237" fill="#64748B" font-size="14" font-weight="600">Location-aware data platforms with practical AI tooling and context engineering.</text>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="850">
      <g transform="translate(282 260)">
        <rect width="96" height="38" rx="13" fill="#ECFDF5" stroke="#B7DDD6"/>
        <text x="48" y="24" text-anchor="middle" fill="#0F766E">GeoAI</text>
      </g>
      <g transform="translate(394 260)">
        <rect width="142" height="38" rx="13" fill="#F0FDFA" stroke="#A7D8D2"/>
        <text x="71" y="24" text-anchor="middle" fill="#0E7490">Scala + Hadoop</text>
      </g>
      <g transform="translate(552 260)">
        <rect width="104" height="38" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="52" y="24" text-anchor="middle" fill="#1D4ED8">AWS ETL</text>
      </g>
      <g transform="translate(672 260)">
        <rect width="124" height="38" rx="13" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="62" y="24" text-anchor="middle" fill="#334155">AI Harness</text>
      </g>
    </g>

    <g transform="translate(824 82)" font-family="Inter, Segoe UI, Arial, sans-serif">
      <rect width="264" height="216" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="24" y="42" fill="#0F172A" font-size="18" font-weight="850">Capability stack</text>
      <text x="24" y="68" fill="#64748B" font-size="12" font-weight="600">A calm, production-minded profile.</text>

      <g transform="translate(24 100)">
        <text x="0" y="0" fill="#334155" font-size="12" font-weight="850">Geo systems</text>
        <rect x="118" y="-11" width="92" height="10" rx="5" fill="#E2E8F0"/>
        <rect x="118" y="-11" width="76" height="10" rx="5" fill="#0F766E" opacity="0.9">
          <animate attributeName="width" values="62;84;76" dur="5s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g transform="translate(24 134)">
        <text x="0" y="0" fill="#334155" font-size="12" font-weight="850">Big-data ETL</text>
        <rect x="118" y="-11" width="92" height="10" rx="5" fill="#E2E8F0"/>
        <rect x="118" y="-11" width="70" height="10" rx="5" fill="#0E7490" opacity="0.9">
          <animate attributeName="width" values="56;80;70" dur="5.4s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g transform="translate(24 168)">
        <text x="0" y="0" fill="#334155" font-size="12" font-weight="850">AWS infra</text>
        <rect x="118" y="-11" width="92" height="10" rx="5" fill="#E2E8F0"/>
        <rect x="118" y="-11" width="64" height="10" rx="5" fill="#2563EB" opacity="0.86">
          <animate attributeName="width" values="52;78;64" dur="5.8s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g transform="translate(24 202)">
        <text x="0" y="0" fill="#334155" font-size="12" font-weight="850">AI harness</text>
        <rect x="118" y="-11" width="92" height="10" rx="5" fill="#E2E8F0"/>
        <rect x="118" y="-11" width="82" height="10" rx="5" fill="#0F766E" opacity="0.86">
          <animate attributeName="width" values="66;88;82" dur="6.2s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <rect x="104" y="318" width="984" height="4" rx="2" fill="url(#brand)" opacity="0.7">
      <animate attributeName="opacity" values="0.35;0.72;0.35" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
