<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Professional brand dashboard for Shaishav Maisuria</title>
  <desc id="desc">A polished product dashboard style banner for AI systems, research workflows, and software craft.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.58" stop-color="#EEF6F4"/>
      <stop offset="1" stop-color="#FFF7ED"/>
    </linearGradient>
    <linearGradient id="ink" x1="130" y1="54" x2="1080" y2="308" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14213D"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="118" y1="286" x2="1066" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A9D8F"/>
      <stop offset="0.52" stop-color="#457B9D"/>
      <stop offset="1" stop-color="#E76F51"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#14213D" flood-opacity="0.16"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.16 0 0 0 0 0.62 0 0 0 0 0.56 0 0 0 0.55 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#14213D" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="heroClip">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect width="1200" height="360" fill="url(#canvas)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1072" cy="48" r="96" fill="#E9C46A" fill-opacity="0.18"/>
    <circle cx="92" cy="312" r="120" fill="#2A9D8F" fill-opacity="0.14"/>

    <g filter="url(#shadow)">
      <rect x="70" y="54" width="520" height="252" rx="24" fill="#FFFFFF"/>
      <rect x="70" y="54" width="520" height="54" rx="24" fill="url(#ink)"/>
      <circle cx="104" cy="81" r="6" fill="#E76F51"/>
      <circle cx="126" cy="81" r="6" fill="#E9C46A"/>
      <circle cx="148" cy="81" r="6" fill="#2A9D8F"/>
      <text x="176" y="88" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">workflow-console</text>

      <rect x="96" y="130" width="142" height="150" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="116" y="158" fill="#14213D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">Focus</text>
      <rect x="116" y="178" width="86" height="10" rx="5" fill="#2A9D8F" fill-opacity="0.24"/>
      <rect x="116" y="202" width="104" height="10" rx="5" fill="#457B9D" fill-opacity="0.22"/>
      <rect x="116" y="226" width="72" height="10" rx="5" fill="#E76F51" fill-opacity="0.22"/>
      <rect x="116" y="250" width="94" height="10" rx="5" fill="#E9C46A" fill-opacity="0.34"/>

      <rect x="260" y="130" width="286" height="150" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="286" y="160" fill="#14213D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">System map</text>
      <path d="M302 240C340 195 378 204 414 176C446 151 493 165 524 138" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)">
        <animate attributeName="stroke-dasharray" values="0 420;120 300;0 420" dur="6s" repeatCount="indefinite"/>
      </path>
      <g>
        <circle cx="302" cy="240" r="8" fill="#2A9D8F"/>
        <circle cx="414" cy="176" r="8" fill="#457B9D"/>
        <circle cx="524" cy="138" r="8" fill="#E76F51"/>
        <circle cx="302" cy="240" r="16" stroke="#2A9D8F" stroke-opacity="0.28">
          <animate attributeName="r" values="12;23;12" dur="3.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.85;0.16;0.85" dur="3.4s" repeatCount="indefinite"/>
        </circle>
      </g>
      <rect x="286" y="190" width="66" height="10" rx="5" fill="#CBD5E1"/>
      <rect x="286" y="212" width="92" height="10" rx="5" fill="#CBD5E1"/>
      <rect x="286" y="234" width="54" height="10" rx="5" fill="#CBD5E1"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="642" y="70" width="488" height="220" rx="26" fill="#FFFFFF"/>
      <rect x="642" y="70" width="488" height="220" rx="26" stroke="#E2E8F0"/>
      <text x="682" y="126" fill="#14213D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="850">Shaishav Maisuria</text>
      <text x="684" y="164" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">AI-assisted workflows, data systems, and practical software.</text>

      <g transform="translate(684 198)">
        <rect width="116" height="44" rx="14" fill="#E6F4F1" stroke="#B7DDD6"/>
        <text x="58" y="28" text-anchor="middle" fill="#1D6F66" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">AI Systems</text>
      </g>
      <g transform="translate(818 198)">
        <rect width="144" height="44" rx="14" fill="#EDF2F7" stroke="#C7D6E4"/>
        <text x="72" y="28" text-anchor="middle" fill="#315B78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">Research Flow</text>
      </g>
      <g transform="translate(980 198)">
        <rect width="104" height="44" rx="14" fill="#FFF2E8" stroke="#F3C7B2"/>
        <text x="52" y="28" text-anchor="middle" fill="#A84931" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">Product</text>
      </g>
    </g>

    <path d="M640 306H1130" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="90 34">
      <animate attributeName="stroke-dashoffset" values="0;-248" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
