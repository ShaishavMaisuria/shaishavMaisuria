<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shaishav Maisuria geospatial data infrastructure header</title>
  <desc id="desc">A clean professional header showing a geospatial data platform with map layers, ETL stages, AWS storage, and serving infrastructure.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="brand" x1="64" y1="326" x2="1136" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E"/>
      <stop offset="0.55" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <pattern id="mapGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" stroke="#D8E8E4" stroke-width="1"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="380" rx="28"/>
    </clipPath>
    <clipPath id="mapClip">
      <rect x="740" y="92" width="298" height="132" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#canvas)"/>
    <rect x="1" y="1" width="1198" height="378" rx="27" stroke="#E2E8F0"/>

    <rect x="56" y="42" width="1088" height="296" rx="28" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="56" y="42" width="8" height="296" rx="4" fill="url(#brand)"/>

    <g transform="translate(104 84)" font-family="Inter, Segoe UI, Arial, sans-serif">
      <rect width="132" height="168" rx="28" fill="#F8FAFC" stroke="#D8E8E4"/>
      <rect x="18" y="18" width="96" height="96" rx="24" fill="#FFFFFF" stroke="#D8E8E4"/>
      <rect x="20" y="20" width="92" height="92" rx="22" fill="url(#mapGrid)" opacity="0.82"/>
      <path d="M35 78C48 63 62 69 72 52C81 37 93 39 101 30" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7">
        <animate attributeName="stroke-dashoffset" values="0;-56" dur="7s" repeatCount="indefinite"/>
      </path>
      <circle cx="35" cy="78" r="5" fill="#0F766E"/>
      <circle cx="72" cy="52" r="5" fill="#0E7490"/>
      <circle cx="101" cy="30" r="5" fill="#2563EB"/>
      <text x="66" y="72" text-anchor="middle" fill="#0F172A" font-size="31" font-weight="850">SM</text>
      <text x="66" y="142" text-anchor="middle" fill="#0F766E" font-size="12" font-weight="850">SPATIAL DATA</text>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="274" y="106" fill="#0F172A" font-size="39" font-weight="850">Shaishav Maisuria</text>
      <text x="276" y="147" fill="#0F766E" font-size="27" font-weight="850">Geospatial Data Infrastructure</text>
      <text x="276" y="181" fill="#334155" font-size="18" font-weight="650">Spatial analytics, big-data ETL, AWS pipelines,</text>
      <text x="276" y="208" fill="#334155" font-size="18" font-weight="650">and AI engineering for production data systems.</text>
      <text x="276" y="236" fill="#64748B" font-size="14" font-weight="600">Turning location-rich data into reliable platforms, indexes, and tools.</text>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="850">
      <g transform="translate(276 260)">
        <rect width="106" height="38" rx="13" fill="#ECFDF5" stroke="#B7DDD6"/>
        <text x="53" y="24" text-anchor="middle" fill="#0F766E">GeoAI</text>
      </g>
      <g transform="translate(398 260)">
        <rect width="130" height="38" rx="13" fill="#F0FDFA" stroke="#A7D8D2"/>
        <text x="65" y="24" text-anchor="middle" fill="#0E7490">Spark / Hadoop</text>
      </g>
      <g transform="translate(544 260)">
        <rect width="100" height="38" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="50" y="24" text-anchor="middle" fill="#1D4ED8">AWS ETL</text>
      </g>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <rect x="716" y="76" width="392" height="222" rx="24" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="740" y="112" fill="#0F172A" font-size="17" font-weight="850">Spatial data platform</text>
      <text x="740" y="136" fill="#64748B" font-size="12" font-weight="650">Ingest, transform, index, and serve map-ready data.</text>

      <g clip-path="url(#mapClip)">
        <rect x="740" y="152" width="150" height="86" rx="16" fill="#FFFFFF" stroke="#D8E8E4"/>
        <rect x="740" y="152" width="150" height="86" fill="url(#mapGrid)" opacity="0.72"/>
        <path d="M750 214C770 191 788 204 806 178C818 160 841 168 872 156" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M760 232C785 211 805 219 829 190C846 170 867 176 884 160" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
        <circle cx="770" cy="191" r="5" fill="#0F766E"/>
        <circle cx="806" cy="178" r="5" fill="#0E7490"/>
        <circle cx="872" cy="156" r="5" fill="#2563EB"/>
      </g>

      <g font-size="12" font-weight="850">
        <g transform="translate(918 157)">
          <rect width="64" height="34" rx="11" fill="#ECFDF5" stroke="#B7DDD6"/>
          <text x="32" y="22" text-anchor="middle" fill="#0F766E">Ingest</text>
        </g>
        <path d="M988 174H1008" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
        <g transform="translate(1014 157)">
          <rect width="66" height="34" rx="11" fill="#F0FDFA" stroke="#A7D8D2"/>
          <text x="33" y="22" text-anchor="middle" fill="#0E7490">Clean</text>
        </g>
        <path d="M951 201V216H1018" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="translate(918 222)">
          <rect width="64" height="34" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/>
          <text x="32" y="22" text-anchor="middle" fill="#1D4ED8">Index</text>
        </g>
        <path d="M988 239H1008" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
        <g transform="translate(1014 222)">
          <rect width="66" height="34" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/>
          <text x="33" y="22" text-anchor="middle" fill="#334155">Serve</text>
        </g>
      </g>

      <g font-size="11" font-weight="850">
        <rect x="740" y="258" width="74" height="24" rx="8" fill="#FFFFFF" stroke="#D8E8E4"/>
        <text x="777" y="274" text-anchor="middle" fill="#0F766E">PostGIS</text>
        <rect x="824" y="258" width="74" height="24" rx="8" fill="#FFFFFF" stroke="#DCE6EF"/>
        <text x="861" y="274" text-anchor="middle" fill="#0E7490">Spark</text>
        <rect x="908" y="258" width="74" height="24" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
        <text x="945" y="274" text-anchor="middle" fill="#1D4ED8">AWS</text>
        <rect x="992" y="258" width="88" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="1036" y="274" text-anchor="middle" fill="#334155">Automation</text>
      </g>
    </g>

    <rect x="104" y="318" width="984" height="4" rx="2" fill="url(#brand)" opacity="0.7">
      <animate attributeName="opacity" values="0.35;0.72;0.35" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
