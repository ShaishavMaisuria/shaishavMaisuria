<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shaishav Maisuria animated profile banner</title>
  <desc id="desc">An animated developer banner with code panels, research nodes, and moving signal paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.45" stop-color="#10223C"/>
      <stop offset="1" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="185" y1="64" x2="980" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.48" stop-color="#34D399"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.22 0 0 0 0 0.82 0 0 0 0 1 0 0 0 0.65 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="terminalClip">
      <rect x="84" y="86" width="370" height="196" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>

  <path d="M72 285C198 215 265 111 408 139C530 163 556 260 694 238C821 218 850 96 986 99C1071 101 1125 148 1166 202" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" filter="url(#softGlow)">
    <animate attributeName="stroke-dasharray" values="0 1300;240 1060;0 1300" dur="7s" repeatCount="indefinite"/>
  </path>

  <g opacity="0.92">
    <rect x="84" y="86" width="370" height="196" rx="18" fill="url(#glass)" stroke="#7DD3FC" stroke-opacity="0.35"/>
    <rect x="84" y="86" width="370" height="34" rx="18" fill="#07111F" fill-opacity="0.7"/>
    <circle cx="112" cy="103" r="5" fill="#F87171"/>
    <circle cx="132" cy="103" r="5" fill="#FBBF24"/>
    <circle cx="152" cy="103" r="5" fill="#34D399"/>
    <g clip-path="url(#terminalClip)" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="18">
      <text x="110" y="152" fill="#E5F6FF">agent.paper.run()</text>
      <text x="110" y="188" fill="#86EFAC">verify_citations()</text>
      <text x="110" y="224" fill="#FDBA74">ship_clear_docs()</text>
      <rect x="110" y="242" width="218" height="14" rx="7" fill="#38BDF8" fill-opacity="0.35">
        <animate attributeName="width" values="120;260;172;305;218" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="110" y="265" width="154" height="10" rx="5" fill="#34D399" fill-opacity="0.32">
        <animate attributeName="width" values="154;230;120;196;154" dur="4.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g transform="translate(548 70)">
    <rect width="560" height="220" rx="22" fill="#081728" fill-opacity="0.58" stroke="#93C5FD" stroke-opacity="0.22"/>
    <text x="34" y="60" fill="#EAF6FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">AI + Research + Software</text>
    <text x="34" y="98" fill="#BFDBFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">building tools that turn complex work into clear workflows</text>

    <g transform="translate(36 132)">
      <rect width="122" height="44" rx="12" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.55"/>
      <text x="22" y="29" fill="#E0F2FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Agents</text>
    </g>
    <g transform="translate(178 132)">
      <rect width="122" height="44" rx="12" fill="#34D399" fill-opacity="0.13" stroke="#34D399" stroke-opacity="0.55"/>
      <text x="23" y="29" fill="#D1FAE5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Data</text>
    </g>
    <g transform="translate(320 132)">
      <rect width="170" height="44" rx="12" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.55"/>
      <text x="24" y="29" fill="#FEF3C7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Developer Tools</text>
    </g>
  </g>

  <g filter="url(#softGlow)">
    <g transform="translate(72 285)">
      <circle r="5" fill="#38BDF8">
        <animateMotion dur="5.2s" repeatCount="indefinite" path="M0 0C126 -70 193 -174 336 -146C458 -122 484 -25 622 -47C749 -67 778 -189 914 -186C999 -184 1053 -137 1094 -83"/>
      </circle>
    </g>
    <g transform="translate(72 285)">
      <circle r="4" fill="#34D399">
        <animateMotion dur="6.4s" begin="1s" repeatCount="indefinite" path="M0 0C126 -70 193 -174 336 -146C458 -122 484 -25 622 -47C749 -67 778 -189 914 -186C999 -184 1053 -137 1094 -83"/>
      </circle>
    </g>
  </g>

  <g opacity="0.85">
    <circle cx="984" cy="100" r="8" fill="#38BDF8"/>
    <circle cx="694" cy="238" r="7" fill="#34D399"/>
    <circle cx="408" cy="139" r="7" fill="#F59E0B"/>
    <circle cx="984" cy="100" r="16" stroke="#38BDF8" stroke-opacity="0.45">
      <animate attributeName="r" values="10;24;10" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
