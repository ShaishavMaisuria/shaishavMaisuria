<svg xmlns="http://www.w3.org/2000/svg" width="960" height="232" viewBox="0 0 960 232" role="img" aria-labelledby="title desc">
  <title id="title">From spatial evidence to checked geometry</title>
  <desc id="desc">Three illustrative scenes in white, sage, and teal. A feature is selected from a raster, represented as a set of geometry points, and traced next to a check mark.</desc>
  <defs>
    <pattern id="canvas-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 40V0H40" fill="none" stroke="#eef3f0"/>
    </pattern>
    <pattern id="layer-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 30V0H30" fill="none" stroke="#cbded6" stroke-width="1.25"/>
    </pattern>
    <rect id="plane" width="310" height="154" rx="5"/>
    <path id="feature" d="M19 106 75 108 119 68 175 73 229 39 288 37"/>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .trace { stroke-dasharray: 100 100; animation: trace 2.65s cubic-bezier(.25,.5,.35,1) both; }
      @keyframes trace { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    }
  </style>
  <rect x="1" y="1" width="958" height="230" rx="7" fill="#fff" stroke="#d4e0dd"/>
  <rect x="2" y="2" width="956" height="228" rx="6" fill="url(#canvas-grid)"/>
  <path d="M326 116h20m-6-6 6 6-6 6m290-6h20m-6-6 6 6-6 6" fill="none" stroke="#69897e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="matrix(.74 .10 -.42 .45 95 65)">
    <use href="#plane" fill="#f4f8f6" stroke="#91b0a4" stroke-width="2"/>
    <path d="M1 5Q1 1 6 1H129L77 46 101 75 57 110 1 95Z" fill="#c5ded2"/>
    <path d="M143 1H257L275 52 215 90 140 122 150 75 113 52Z" fill="#dfeee6"/>
    <path d="M205 113 309 65V149Q309 153 304 153H143Z" fill="#d2e6dc"/>
    <use href="#plane" fill="url(#layer-grid)"/>
    <use href="#feature" fill="none" stroke="#46635a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="101" y="48" width="86" height="42" fill="none" stroke="#08766b" stroke-width="4"/>
  </g>
  <g transform="matrix(.74 .10 -.42 .45 401 65)">
    <use href="#plane" fill="#f7fbf9" stroke="#91b0a4" stroke-width="2"/>
    <use href="#plane" fill="url(#layer-grid)"/>
    <path d="M46 114 82 77 125 18m50 55 46 41 69 2" fill="none" stroke="#9bbbaf" stroke-width="3"/>
    <use href="#feature" fill="none" stroke="#08766b" stroke-width="5" stroke-dasharray="7 5" stroke-linecap="round"/>
    <g fill="#fff" stroke="#08766b" stroke-width="4">
      <circle cx="75" cy="108" r="6"/><circle cx="119" cy="68" r="6"/><circle cx="229" cy="39" r="6"/>
    </g>
  </g>
  <g transform="matrix(.74 .10 -.42 .45 707 65)">
    <use href="#plane" fill="#eaf5f1" stroke="#91b0a4" stroke-width="2"/>
    <use href="#plane" fill="url(#layer-grid)"/>
    <use href="#feature" fill="none" stroke="#a7d2c4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="trace" pathLength="100" d="M19 106 75 108 119 68 175 73 229 39 288 37" fill="none" stroke="#08766b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(853 153)" stroke="#08766b" stroke-width="2.5">
    <circle r="12" fill="#fff"/>
    <path d="m-5 0 4 4 6-8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
