<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shaishav Maisuria professional brand header</title>
  <desc id="desc">A clean white brand header with a monogram, professional positioning, and contained workflow cards.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="brand" x1="70" y1="300" x2="1080" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E"/>
      <stop offset="0.58" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#canvas)"/>
    <rect x="1" y="1" width="1198" height="358" rx="27" stroke="#E2E8F0"/>

    <rect x="56" y="48" width="1088" height="264" rx="28" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="56" y="48" width="8" height="264" rx="4" fill="url(#brand)"/>

    <g transform="translate(104 92)">
      <rect width="92" height="92" rx="24" fill="#ECFDF5" stroke="#B7DDD6"/>
      <text x="46" y="58" text-anchor="middle" fill="#0F766E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="850">SM</text>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="224" y="112" fill="#0F172A" font-size="40" font-weight="850">Shaishav Maisuria</text>
      <text x="226" y="150" fill="#334155" font-size="19" font-weight="650">AI-assisted workflows, data systems,</text>
      <text x="226" y="178" fill="#334155" font-size="19" font-weight="650">and practical software craft.</text>
      <text x="226" y="210" fill="#64748B" font-size="15" font-weight="600">Clear systems for automation, analysis, and readable engineering.</text>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <g transform="translate(224 232)">
        <rect width="132" height="42" rx="14" fill="#ECFDF5" stroke="#B7DDD6"/>
        <text x="66" y="27" text-anchor="middle" fill="#0F766E" font-size="14" font-weight="800">AI Workflows</text>
      </g>
      <g transform="translate(372 232)">
        <rect width="132" height="42" rx="14" fill="#F0FDFA" stroke="#A7D8D2"/>
        <text x="66" y="27" text-anchor="middle" fill="#0E7490" font-size="14" font-weight="800">Data Systems</text>
      </g>
      <g transform="translate(520 232)">
        <rect width="162" height="42" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="81" y="27" text-anchor="middle" fill="#1D4ED8" font-size="14" font-weight="800">Software Craft</text>
      </g>
    </g>

    <g transform="translate(756 84)" font-family="Inter, Segoe UI, Arial, sans-serif">
      <rect width="328" height="188" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="28" y="42" fill="#0F172A" font-size="18" font-weight="850">Brand system</text>
      <text x="28" y="68" fill="#64748B" font-size="13" font-weight="600">Focused, calm, and implementation-minded.</text>

      <g transform="translate(28 94)">
        <text x="0" y="0" fill="#334155" font-size="13" font-weight="800">Systems</text>
        <rect x="104" y="-11" width="156" height="10" rx="5" fill="#E2E8F0"/>
        <rect x="104" y="-11" width="124" height="10" rx="5" fill="#0F766E" opacity="0.85">
          <animate attributeName="width" values="106;136;124" dur="5s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g transform="translate(28 128)">
        <text x="0" y="0" fill="#334155" font-size="13" font-weight="800">Data</text>
        <rect x="104" y="-11" width="156" height="10" rx="5" fill="#E2E8F0"/>
        <rect x="104" y="-11" width="112" height="10" rx="5" fill="#0E7490" opacity="0.85">
          <animate attributeName="width" values="92;126;112" dur="5.4s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g transform="translate(28 162)">
        <text x="0" y="0" fill="#334155" font-size="13" font-weight="800">Craft</text>
        <rect x="104" y="-11" width="156" height="10" rx="5" fill="#E2E8F0"/>
        <rect x="104" y="-11" width="132" height="10" rx="5" fill="#2563EB" opacity="0.82">
          <animate attributeName="width" values="118;144;132" dur="5.8s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <rect x="104" y="294" width="980" height="4" rx="2" fill="url(#brand)" opacity="0.72">
      <animate attributeName="opacity" values="0.35;0.72;0.35" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
