<svg width="1200" height="230" viewBox="0 0 1200 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shaishav Maisuria toolbox</title>
  <desc id="desc">A professional toolbox panel with uniform white, slate, teal, cyan, and blue styling.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="190" x2="1130" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E"/>
      <stop offset="0.55" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="230" rx="26" fill="url(#surface)"/>
  <rect x="1" y="1" width="1198" height="228" rx="25" stroke="#E2E8F0"/>
  <path d="M70 188H1130" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="92 36" opacity="0.62">
    <animate attributeName="stroke-dashoffset" values="0;-256" dur="7s" repeatCount="indefinite"/>
  </path>

